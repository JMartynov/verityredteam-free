name: e2e-containers

on:
  workflow_call:
    inputs:
      install_source:
        type: string
        default: wheel
  workflow_dispatch:
    inputs:
      install_source:
        type: choice
        options:
          - wheel
          - pypi
        default: wheel
  schedule:
    - cron: '0 4 * * *'
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/**"
      - "README.md"
      - "tests/e2e_containers/**"

jobs:
  e2e-containers:
    name: Ground-zero container verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Run container E2E verification
        if: ${{ inputs.install_source != 'pypi' }}
        env:
          INSTALL_SOURCE: wheel
        run: bash ./tests/e2e_containers/run_e2e.sh

      - name: Run container E2E verification (PyPI)
        if: ${{ inputs.install_source == 'pypi' }}
        env:
          INSTALL_SOURCE: pypi
        run: bash ./tests/e2e_containers/run_e2e.sh
