name: e2e-containers

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "src/**"
      - "README.md"
      - "tests/e2e_containers/**"

jobs:
  e2e-containers:
    name: Ground-zero container verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Run container E2E verification
        env:
          INSTALL_SOURCE: wheel
        run: bash ./tests/e2e_containers/run_e2e.sh
