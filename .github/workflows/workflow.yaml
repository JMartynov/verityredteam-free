name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  full-tests:
    name: Run Full Test Suite
    uses: ./.github/workflows/full-tests.yml

  pypi-publish:
    name: Build and publish to PyPI
    needs: full-tests
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/verity-redteam-core
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Run lint and unit tests before build
        run: |
          uv sync --extra dev
          uv run ruff check src tests scripts
          uv run pytest tests/ -q

      - name: Build wheel and sdist
        run: uv build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish distribution to PyPI via Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub Release
    needs: pypi-publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Generate SHA256SUMS
        run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt --clobber

  post-publish-e2e:
    name: Post-publish E2E containers
    needs: pypi-publish
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/e2e-containers.yml
    with:
      install_source: pypi
