name: Deploy Documentation Portal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: Verify generated portal docs are up to date
        run: uv run python scripts/build_docs_portal.py --check
      - name: Build MkDocs Material site (strict)
        run: uv run mkdocs build --strict
      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress site/ docs/
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Read version
        id: version
        run: echo "version=$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
      - name: Deploy versioned docs (mike)
        run: |
          uv run mike deploy --push --update-aliases ${{ steps.version.outputs.version }} latest
          uv run mike set-default --push latest
