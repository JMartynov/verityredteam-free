name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    env:
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      ANTIGRAVITY_API_KEY: ""
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - name: Lint and Code Style Checks
        run: uv run --extra dev ruff check src tests
      - name: Run Fast Test Suite
        run: uv run --extra dev pytest tests/ -q
      - name: Verify Zero-Docker Demo Targets CLI
        run: uv run verity test --demo
