[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "verity-redteam-core"
version = "0.2.1"
description = "Verity RedTeam Free — Open-Core MCP Security Scanner, SQL AST Guard, and Audit Server"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "packaging>=24.0",
    "sqlglot>=25.0.0",
    "mcp-fingerprints>=1.3.6",
    "mcp-vulnerabilities>=1.2.2",
    "rich>=13.7.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
    "mkdocs-material>=9.5.0",
    "mike>=2.1",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mike>=2.1",
]

[project.scripts]
verity = "verity.cli:main"
verity-redteam-core = "verity.cli:main"

[project.urls]
Homepage = "https://jmartynov.github.io/verityredteam-free/"
Repository = "https://github.com/JMartynov/verityredteam-free"
Documentation = "https://jmartynov.github.io/verityredteam-free/"
Issues = "https://github.com/JMartynov/verityredteam-free/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"verity.data" = ["*.json.gz"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
