name: verity-e2e

services:
  target-sse-lab:
    build:
      context: .
      dockerfile: Dockerfile.target-sse-lab
    networks:
      - verity-e2e-net
    expose:
      - "8000"
      - "8001"
      - "8002"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; [urllib.request.urlopen(f'http://127.0.0.1:{p}/health', timeout=2) for p in (8000, 8001, 8002)]"
      interval: 2s
      timeout: 3s
      retries: 15

  customer-pip:
    build:
      context: .
      dockerfile: Dockerfile.customer-pip
      args:
        INSTALL_SOURCE: ${INSTALL_SOURCE:-wheel}
        VERITY_VERSION: ${VERITY_VERSION:-}
    environment:
      VERITY_VERSION: ${VERITY_VERSION:-}
    networks:
      - verity-e2e-net
    depends_on:
      target-sse-lab:
        condition: service_healthy
    volumes:
      - ./snapshots:/snapshots

  customer-uvx:
    build:
      context: .
      dockerfile: Dockerfile.customer-uvx
      args:
        INSTALL_SOURCE: ${INSTALL_SOURCE:-wheel}
        VERITY_VERSION: ${VERITY_VERSION:-}
    environment:
      VERITY_VERSION: ${VERITY_VERSION:-}
    networks:
      - verity-e2e-net
    depends_on:
      target-sse-lab:
        condition: service_healthy

  customer-full-workstation:
    build:
      context: .
      dockerfile: Dockerfile.customer-workstation
      args:
        INSTALL_SOURCE: ${INSTALL_SOURCE:-wheel}
        VERITY_VERSION: ${VERITY_VERSION:-}
    environment:
      VERITY_VERSION: ${VERITY_VERSION:-}
    networks:
      - verity-e2e-net
    depends_on:
      target-sse-lab:
        condition: service_healthy

networks:
  verity-e2e-net:
    driver: bridge
